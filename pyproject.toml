[project]
name = "sae"
version = "0.2.0"
description = "Sparse Autoencoders pour l'analyse interprétable de mails clients EDF (deux pipelines : Gemma-3+GemmaScope-2, F2LLM+PhraseLevelSAE)"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{name = "Grégoire Pelletier", email = "gregoire.pelletier80@gmail.com"}]
dependencies = [
    "datasets>=2.21.0",
    "hdbscan>=0.8.40",
    "hf>=1.21.0",
    "huggingface-hub>=1.21.0",
    "matplotlib>=3.10.8",
    "networkx>=3.4",
    "numpy<2.0.0",
    "pandas<3.0.0",
    "plotly>=5.24.0",
    "pytest>=9.1.1",
    "sae-lens>=6.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.59.2",
    "torch>=2.6.0",
    "transformer-lens>=1.19.0",
    "transformers>=4.57.6",
    "typeguard>=4.5.1",
    "umap-learn>=0.5.12",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'"},
]
torchvision = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'"},
]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version == '3.12'",
    "sys_platform == 'win32' and python_version == '3.12'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "external",
    "node_modules",
    ".git",
    ".venv",
    "*.egg-info"
]
