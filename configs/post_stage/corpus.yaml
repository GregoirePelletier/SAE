# Configuration du gel de corpus (plan §4.1-4.2). Source de verite pour
# regenerer configs/post_stage/{corpus_manifest,split_assignments}.json via
# src/post_stage/dataset_contract.py::build_corpus_manifest.

mails_tsv_path: local_data/emails/Mails.tsv
augmented_jsonl_path: local_data/emails/augmented_mails.jsonl
status: synthetic  # aucune donnee client reelle a ce jour dans cette campagne

split:
  seed: 20260914  # POST_STAGE_SPLIT_SEED -- decouple de SEED/CORPUS_SPLIT_SEED (config.py)
  fit: 0.60
  dev: 0.15
  confirm: 0.25
  unit: parent_email  # parent-aware : une variante augmentee suit toujours son mail d'origine

join:
  # augmented_mails.jsonl reel ne porte PAS parent_sha1 (verifie) : jointure
  # positionnelle via parent_id, qui vit dans l'espace load_mails_tsv (3480
  # lignes) et non dans l'espace load_and_clean_emails (3474 lignes, 6 lignes
  # de plus filtrees : positions 43/707/1243/1344/1366/2149). Le manifeste
  # actuel traduit parent_id via load_and_clean_emails(return_positions=True) ;
  # l'ancien manifeste (enumeration 0..n-1, decalee) est archive dans
  # configs/post_stage/legacy_pre_parent_join_fix/ -- 54,7% des variantes y
  # etaient dans le mauvais split (docs/RESULTS_STATUS.md).
  method: positional_via_parent_id

rules:
  - "CONFIRM n'entre jamais dans : encodeur entraine, IDF, PCA d'initialisation,
     seuil de regroupement, choix de requete, calibration p90, reglage de sonde."
  - "Une variante garde le split de son mail parent (aucune fuite variante/parent)."
  - "Le manifeste et les assignations de split ne contiennent jamais de texte
     brut -- seulement sha1/comptages (configs/post_stage/*.json, versionnes)."
